name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked development environment
        run: |
          python -m pip install uv
          uv sync --frozen --extra dev
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Test deterministic and localhost integrations
        run: uv run --no-sync pytest -q -ra
      - name: Build distribution
        run: uv build --offline
      - name: Verify wheel installation
        run: |
          python -m venv /tmp/harness-wheel-check
          /tmp/harness-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/harness-wheel-check/bin/harness --help
