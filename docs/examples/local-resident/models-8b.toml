# Paths inside the documented offline container. Provision assets separately.
# This workflow qualification does not assert universal adapter conformance.
[models.local-small]
route = "openai/local-small"
api_base = "http://127.0.0.1:8080/v1"
max_input_tokens = 8192
verified = false

[models.local-small.local]
auto_start = true
cwd = "/app"
probe_kind = "llamacpp"
startup_seconds = 30
probe_seconds = 2
required_files = ["/app/llama-server", "/models/8b.gguf"]
env_names = ["LD_LIBRARY_PATH"]
command = [
  "/app/llama-server", "--model", "/models/8b.gguf", "--alias", "local-small",
  "--host", "127.0.0.1", "--port", "8080", "--n-gpu-layers", "99",
  "--ctx-size", "8192", "--parallel", "1", "--threads", "4", "--threads-batch", "4",
  "--flash-attn", "on", "--jinja", "--cache-ram", "0", "--fit", "off",
  "--chat-template-kwargs", '{"enable_thinking":false}',
  "--temp", "0.7", "--top-p", "0.8", "--top-k", "20", "--min-p", "0",
  "--presence-penalty", "1.5"
]
