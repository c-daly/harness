    Add `harness doctor`, per-adapter probes, a shipped compatibility manifest with hash-bound verification records, a release support floor, and stable exit codes.

    **Files:**
    - Create: `src/harness/diagnostics.py`, `src/harness/cli_output.py`, `src/harness/exit_codes.py`, `src/harness/provider_compat.toml`, `src/harness/release_support.toml`
    - Modify: `src/harness/provider.py` (`ProviderStatus`, `ProviderCapabilities`, `probe`), `src/harness/provider_litellm.py`, `src/harness/provider_claude_code.py`, `src/harness/provider_codex.py`, `src/harness/provider_antigravity.py`, `src/harness/catalog.py` (deprecate `verified`), `src/harness/cli.py` (insert `doctor` and `config` ladder entries immediately after the `argv[0] == "handoff"` entry; `--version`)
    - Create: `tests/test_diagnostics.py`; Modify: `tests/test_catalog.py`, `tests/test_package_metadata.py`, provider adapter tests
    - Create: `docs/provider-support.md` (generated), `docs/diagnostics.md`

    **Do:**
    - Define frozen `ProviderCapabilities` (tool surface, filesystem, transport network required, native network, content kinds, structured history, streaming, accounting availability for tokens and cost independently, cancellation, parallel tool calls) and `ProviderStatus(backend, adapter, adapter_version, provider_version, tier, capabilities, verified, evidence, limitations)`; `verified=True` requires non-empty evidence.
    - Ship `provider_compat.toml` records with `verification_surface` paths and `verification_surface_sha256`; status is verified only when current bytes and detected dependency versions hash to the recorded value; catalog `verified` is deprecated with a warning and cannot elevate.
    - Ship `release_support.toml` naming `litellm-openai-api`, `litellm-anthropic-api`, `claude-code-subscription`, `codex-subscription` with minimum tiers; `ReleaseSupportFloor.evaluate` reports unsatisfied records.
    - `probe(model) -> ProbeResult` per adapter: binary presence, `--version` parse, credential file presence by name only, manifest version check; `--live` performs one minimal completion.
    - `harness doctor [--model ALIAS] [--json]`, `harness config show --effective [--json]`, `harness --version`; one renderer in `cli_output.py`; exit codes 0/2/3/4/5/6/7 as in the hardening plan Task 5.
    - Generate `docs/provider-support.md` from the manifest and add a test that the committed file matches the generator output.
    - Tests: manifest parsing rejections, hash drift makes status unverified, catalog cannot elevate, probes with fake binaries, JSON output has no ANSI or secrets, exit-code mapping per family.
    - Run Ruff, complete suites, build, smoke; push `task/21-diagnostics-provider-probes-and-compatibility-manifest`; open PR with `--base task/8-pattern-redaction-and-minimal-child-environments`.

    **Verify:**
    - `uv run pytest -q tests/test_diagnostics.py tests/test_catalog.py tests/test_package_metadata.py` passes; the wheel contains both TOML files.
    - Complete suites, Ruff, build and smoke pass; PR open with CI passing.
  target_dir: .
  test_dir: tests
  depends_on:
  - 8-pattern-redaction-and-minimal-child-environments
- name: 22-execution-profiles-and-recorded-trust-boundary
  description: |
    Enforce `production`/`compatible`/`unsafe` execution profiles after routing and before provider start, record the effective provider status on each model call, and define resume transitions.

    **Files:**
    - Create: `src/harness/runtime_policy.py`
    - Modify: `src/harness/events.py` (defaulted `execution_profile` on `SessionStarted`, `provider_status` on model `DispatchResolved`, new additive `ExecutionProfileChanged`), `src/harness/session.py`, `src/harness/fold.py`, `src/harness/resume.py`, `src/harness/dispatcher.py`, `src/harness/cli.py` (`--profile`, `--allow-profile-downgrade`), `src/harness/telemetry.py`
    - Create: `tests/test_runtime_policy.py`; Modify: `tests/test_events.py`, `tests/test_cli.py`, `tests/test_dispatcher.py`, `tests/test_telemetry.py`
    - Modify: `docs/user-guide.md`, `docs/diagnostics.md`

    **Do:**
    - Implement `ExecutionProfile` and `evaluate_provider(profile, status, required_content, limits)` raising a teaching `ProviderPolicyError`: production accepts only verified `strict`/`contained`; compatible rejects a missing required content kind; unsafe accepts all with one stderr warning per process; a finite token/cost budget that depends on accounting the provider declares absent refuses before start.
    - Enforce in `dispatch_model` after hooks and routing, before `ModelCallStarted`; a refusal emits `ModelCallFailed(error_type="provider_policy")` and never invokes the provider.
    - Default remains `compatible`; child sessions inherit and cannot weaken; resume with a stronger profile records the change, a weaker one requires TUI confirmation or `--allow-profile-downgrade`; fold exposes current and weakest profile; telemetry stores them.
    - Echo with no configured model is a labelled demo state, and a real prompt without a route exits nonzero.
    - Tests: truth table, old events parse with defaults, refusal before provider start, inheritance, resume transitions, telemetry fields.
    - Update docs; run Ruff, complete suites, build, smoke; push `task/22-execution-profiles-and-recorded-trust-boundary`; open PR with `--base task/21-diagnostics-provider-probes-and-compatibility-manifest`.

    **Verify:**
    - `uv run pytest -q tests/test_runtime_policy.py tests/test_events.py tests/test_cli.py tests/test_dispatcher.py tests/test_telemetry.py` passes.
    - Complete suites, Ruff, build and smoke pass; PR open with CI passing.
  target_dir: .
  test_dir: tests
  depends_on:
  - 21-diagnostics-provider-probes-and-compatibility-manifest
- name: 23-filesystem-containment-primitives
  description: |
    Prove the Linux/WSL2 filesystem and process boundary for trusted CLI children with bubblewrap, without claiming network containment.

    **Files:**
    - Create: `src/harness/process_sandbox.py`, `tests/fixtures/fake_hostile_cli.py`, `tests/test_process_sandbox.py`, `tests/containment/conftest.py`, `tests/containment/test_live_boundary.py`, `docs/security/provider-containment.md`
    - Modify: `src/harness/diagnostics.py` (sandbox probe in `doctor`)

    **Do:**
    - Implement `FilesystemSandboxPolicy` (read-only runtime roots, private scratch roots, inherited descriptors, executable, `share_host_network=True` only), `SandboxAvailability` (`missing`, `present_unusable`, `functional`), `probe_sandbox()` executing `/usr/bin/true` under a minimal policy, and `build_sandboxed_argv(policy, argv)` producing a bubblewrap command with a new mount namespace, empty cwd, private 0700 scratch HOME, minimal `/etc` resolver and certificate material, private `/tmp`, `--die-with-parent`, only null/random devices, and no `--unshare-net`.
    - Live containment test marked `containment`, run only on Linux with a functional probe: the hostile fake CLI fails to read or enumerate a real-home sentinel and to write a workspace sentinel, succeeds in its scratch, leaves no surviving child, and real credential copies stay byte-identical; evidence JSON is written only when an output path is given.
    - `doctor` reports the probe with remediation; unit tests inject each availability outcome; argv construction tests cover symlinked roots, spaces and leading dashes.
    - Write the containment doc stating that transport network access remains and that this is not native-tool network containment.
    - Run Ruff, complete suites, build, smoke; push `task/23-filesystem-containment-primitives`; open PR with `--base task/21-diagnostics-provider-probes-and-compatibility-manifest`.

    **Verify:**
    - `uv run pytest -q tests/test_process_sandbox.py tests/containment -m containment` passes on this host (bubblewrap is installed at `/usr/bin/bwrap`).
    - Complete suites, Ruff, build and smoke pass; PR open with CI passing.
  target_dir: .
  test_dir: tests
  depends_on:
  - 21-diagnostics-provider-probes-and-compatibility-manifest
- name: 24-plugin-digest-trust-and-atomic-grants
  description: |
    Make permission grant persistence atomic and require digest-bound local trust before importing plugin Python in production.

    **Files:**
    - Create: `src/harness/plugin_trust.py`, `tests/test_plugin_trust.py`
    - Modify: `src/harness/permissions.py` (`PermissionGrantStore`), `src/harness/plugins.py` (trust check before `_load_module`), `src/harness/events.py` (additive `PluginTrustDecided(plugin, path_hash, digest, trusted)`), `src/harness/cli.py` (insert `plugins trust|revoke|list` inside the `plugins` subcommand from Task 3 if present, else insert a `plugins` ladder entry immediately after the `argv[0] == "budget"` entry)
    - Modify: `tests/test_permissions.py`, `tests/test_plugins.py`, `tests/test_cli.py`
    - Modify: `docs/plugin-authoring.md`, `docs/user-guide.md`

    **Do:**
    - `PermissionGrantStore` holds an advisory lock, parses and merges, renders deterministic sorted TOML, writes a 0600 temporary file, fsyncs, replaces and fsyncs the directory; deny precedence and layering unchanged; the TUI and headless "always" paths use it.
    - `plugin_digest(root)` hashes sorted relative paths, modes and bytes, never follows symlinks outside the root, excludes caches and bytecode, rejects cycles and broken links.
    - In `production` (from Task 22) refuse plugins with executable Python, MCP declarations, emitters or dispatch hooks unless their current digest is trusted; prompt-only skills, commands and agents load as `data-only`; `compatible` warns; `unsafe` annotates. Re-stat every hashed file immediately before import.
    - CLI trust management shows the canonical path, requires confirmation unless `--yes` with an exact path, and stores records privately; the session log records only a path hash.
    - Tests: concurrent grants from two processes, failure during replace leaves the prior file valid, digest stability and sensitivity, symlink refusal, trust invalidation on a one-byte change before import, profile behavior matrix, CLI journeys.
    - Update docs; run Ruff, complete suites, build, smoke; push `task/24-plugin-digest-trust-and-atomic-grants`; open PR with `--base task/22-execution-profiles-and-recorded-trust-boundary`.

    **Verify:**
    - `uv run pytest -q tests/test_plugin_trust.py tests/test_permissions.py tests/test_plugins.py tests/test_cli.py` passes.
    - Complete suites, Ruff, build and smoke pass; PR open with CI passing.
  target_dir: .
  test_dir: tests
  depends_on:
  - 22-execution-profiles-and-recorded-trust-boundary
